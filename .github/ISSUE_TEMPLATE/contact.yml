name: Contact xic
description: Send a public message about a project, an idea, or something xic wrote.
title: "[Contact] "
labels:
  - contact
assignees:
  - xicv
body:
  - type: markdown
    attributes:
      value: |
        Thanks for getting in touch. This form creates a public GitHub issue, and replies will also be public.
        Do not include email addresses, credentials, private documents, personal information, or anything sensitive.

  - type: dropdown
    id: topic
    attributes:
      label: What would you like to talk about?
      options:
        - A project
        - Something I wrote
        - A collaboration or idea
        - Something else
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Message
      description: A short message is enough. I can reply here on GitHub.
      placeholder: Hi xic, I wanted to ask about...
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public message check
      options:
        - label: I understand this message and any replies will be public, and I have not included private or sensitive information.
          required: true
