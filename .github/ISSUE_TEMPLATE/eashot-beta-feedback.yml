name: eaShot beta feedback
description: Report a beta problem or tell us what would make eaShot more useful.
title: "[eaShot beta] "
assignees:
  - xicv
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing eaShot. This submission creates a public GitHub issue.
        Do not include captured images, private documents, email addresses, license keys, sensitive app names, or personal information.

  - type: dropdown
    id: area
    attributes:
      label: What are you reporting?
      options:
        - Capture region or screen geometry
        - Screen Recording permission or setup
        - Clipboard or folder output
        - Remembered region, pinned capture, or suggestion
        - Shortcut or launch at login
        - Download or installation
        - User interface or accessibility
        - General feedback
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: eaShot version and build
      description: Open eaShot Settings and copy the version and build, for example 0.1.0 (1).
      placeholder: 0.1.0 (1)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.6
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac model and chip
      description: A general model is enough; do not include a serial number.
      placeholder: 14-inch MacBook Pro, Apple M4 Pro
    validations:
      required: true

  - type: textarea
    id: capture_setup
    attributes:
      label: Capture setup
      description: Include the selected region, ratio, display arrangement, and output mode. Do not describe private on-screen content.
      placeholder: Right side; 50%; one external display; clipboard only.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce or feedback context
      description: Give the shortest sequence that lets us understand what happened.
      placeholder: |
        1. Opened the menu bar picker.
        2. Selected Right at 50%.
        3. Pressed Capture.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include exact eaShot error text if one appeared, but omit captured or sensitive information.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Once
        - Not applicable - this is general feedback
    validations:
      required: true

  - type: dropdown
    id: reuse
    attributes:
      label: Would you use eaShot in a normal week?
      options:
        - Yes, most days
        - Yes, once or twice a week
        - Occasionally
        - Not yet
    validations:
      required: true

  - type: dropdown
    id: value
    attributes:
      label: Would a polished version be worth a one-time purchase?
      options:
        - "Yes"
        - "Maybe"
        - "No"
        - "Prefer not to answer"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report privacy check
      options:
        - label: I checked this report and removed captured, private, or sensitive information.
          required: true
